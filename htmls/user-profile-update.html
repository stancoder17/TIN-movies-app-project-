<body>
<header>

        <div class="navbar-main-buttons">

</header>

<main>
    <div class="main-content">
        <form class="user-profile-header" action="../htmls/user-profile.html">
            <div class="user-avatar-edit">
                <img class="user-avatar  user-avatar-big" src="../images/user-avatar-example.jpg" alt="user-profile-img">
                <input type="file" id="avatar" name="avatar" accept="image/*">
            </div>
            <div class="user-profile-details">
                <h1>
                    <input type="text" id="username" name="username" value="randomuser9419">
                </h1>
                <textarea id="aboutMe" name="aboutMe">"I love movies, movies very good, andor best, I like, yes."</textarea>
                <div class="user-labels-and-values">
                    <div class="user-details-labels">
                        <h3>
                            <label class="text-main-dark" for="email">Email:</label>
                        </h3>
                        <h3>
                            <label class="text-main-dark" for="dateOfBirth">Date of birth:</label>
                        </h3>
                    </div>
                    <div class="user-details-values">
                        <h3>
                            <input type=email id="email" name="email" value="user9419@example.com">
                        </h3>
                        <h3>
                            <input type="date" id="dateOfBirth" name="dateOfBirth" value="1995-04-12">
                        </h3>
                    </div>
                </div>

                <div class="user-profile-buttons">
                    <button class="btn-blue" type="submit">Save</button>
                    <button class="btn-red" type="button" onclick="window.location.href='../htmls/user-profile.html'">Cancel</button>
                </div>
            </div>
        </form>
    </div>
</main>
