<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit production</title>
    <link rel="stylesheet" href="../stylesheets/main.css">
    <link rel="stylesheet" href="../stylesheets/production-add.css">
</head>
<body>
<header>
    <div class="navbar">

        <div class="navbar-main-buttons">

            <a class="navbar-text-button" id="navbar-img-button" href="#">
                <img class="logo-img" src="../images/pngtree-video-film-camera-icon-picture-image_7817710.png" alt="logo">
            </a>
            <a class="text-main navbar-text-button" href="#">MOVIES</a>
            <a class="text-main navbar-text-button" href="#">SERIES</a>
        </div>

        <button type="button" onclick="window.location.href='../htmls/login.html'">LOG IN</button>
    </div>

</header>

<main>
    <div class="main-content">
        <div class="form-container">
            <h1 class="text-main">Edit production</h1>

            <hr class="separator">

            <form class="add-form" action="details.html">
                <div class="form-inputs-container">
                    <input type="text" id="title" name="title" value="Andor" placeholder="Title" class="form-input">
                    <textarea id="description" name="description" class="form-input-description" placeholder="Description">In perilous times fraught with intrigue and betrayal, Cassian Andor joins the fight against the tyranny of the Galactic Empire. He soon becomes a hero of the Rebellion.</textarea>
                    <input type="text" id="creator" name="creator" value="Tony Gilroy" placeholder="Creator" class="form-input">
                    <label for="image" class="text-main">
                        <img class="media-poster" src="../images/posters/andor.jpg" alt="andor poster">
                    </label>
                    <input type="file" id="image" name="image"  class="form-input form-input-file" accept="image/*">
                    <label for="releaseDate" class="text-main"></label>
                    <input type="date" id="releaseDate" name="releaseDate" value="2022-09-21" class="form-input">
                </div>

                <div class="form-buttons-etc">
                    <button type="submit" class="btn-blue wide">Submit</button>
                </div>
            </form>
        </div>

    </div>

</main>

<footer>
    <div class="footer-links">

        <div class="link-group">

            <h5 class="text-main">Top 5 Movies</h5>

            <ul class="list-unstyled">
                <li><a href="#">Star Wars: Rogue One</a></li>
                <li><a href="#">The Lord of the Rings: The Return of the King</a></li>
                <li><a href="#">Interstellar</a></li>
                <li><a href="#">Avatar</a></li>
                <li><a href="#">Indiana Jones: Raiders of the Lost Ark</a></li>
            </ul>

        </div>

        <div class="link-group">

            <h5 class="text-main">Top 5 Series</h5>

            <ul class="list-unstyled">
                <li><a href="#">Andor</a></li>
                <li><a href="#">The Bear</a></li>
                <li><a href="#">Star Wars: The Clone Wars</a></li>
                <li><a href="#">The Mandalorian</a></li>
                <li><a href="#">Dark</a></li>
            </ul>

        </div>

    </div>

</footer>
</body>
</html>
